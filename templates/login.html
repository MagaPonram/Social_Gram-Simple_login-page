<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialGram Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="login-card">

            <h1 class="logo">SocialGram</h1>

            <p class="subtitle">
                Connect. Share. Enjoy.
            </p>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Log In
                </button>

            </form>

            {% if message %}
            <p class="error">
                {{ message }}
            </p>
            {% endif %}

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>

        <div class="signup-card">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

        <p class="footer">
            © 2026 SocialGram
        </p>

    </div>

</body>
</html>
